; =============================================================================
; PlatformIO project config for ESP32-WROVER Camera (v1.5 / WROVER-KIT pins)
; =============================================================================
; This file tells PlatformIO:
;   - which microcontroller board you have
;   - which framework (Arduino) to use
;   - how to build and upload firmware
;
; Common commands (run from this folder):
;   pio run              -> compile only
;   pio run -t upload    -> compile + flash over USB
;   pio device monitor   -> read Serial.println() output from the board
; =============================================================================

[env:esp-wrover-kit]
; Espressif's PlatformIO platform (compiler, SDK, upload tools)
platform = espressif32 @ 6.8.1

; Board profile: ESP32-WROVER with PSRAM (needed for decent camera frames)
board = esp-wrover-kit

; We write Arduino-style code (setup/loop), not bare ESP-IDF
framework = arduino

; Baud rate for `pio device monitor` — must match Serial.begin() in main.cpp
monitor_speed = 115200

; CameraWebServer is a large sketch. "Huge APP" gives ~3MB for the program
; so it fits; the tradeoff is less space for OTA update slots.
board_build.partitions = huge_app.csv

; BOARD_HAS_PSRAM enables PSRAM-aware camera buffers in the example code.
; (The esp-wrover-kit board profile already expects PSRAM hardware.)
build_flags =
	-DBOARD_HAS_PSRAM

; Upload over the USB-UART chip (CH340 / CP210x / etc. on the board)
; Uncomment and set if PlatformIO picks the wrong port:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
